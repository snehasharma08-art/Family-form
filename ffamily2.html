<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Family App</title>
    <link rel="stylesheet" href="ffamily2.css" />
  </head>
  <body>
    <div class="container">
      <h1>My Family</h1>

      <input type="text" id="search" placeholder="Search member by name" />
      <button onclick="searchMember()">Search</button>

      <input id="newFamily" placeholder="Add New Family" />
      <button onclick="addFamily()">Add Family</button>

      <div id="result"></div>

      <h2>All Members</h2>
      <div id="members"></div>
    </div>

    <script src="ffamily2.js"></script>
  </body>
</html>
